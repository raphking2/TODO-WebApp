{% extends 'base.html' %}
{% block head %}
<title>Todo App</title>
{% endblock %}

{% block body %}

<!-- <h1> ToDo WebApp</h1> -->
<div class="content">

    <h1>ToDo WebApp</h1>
    <h2>Update Task</h2>

    <form action="/update/{{task.id}}" method="POST">
        <input type="text" name="content" id="content" placeholder="Enter your Todo here" value="{{task.content}}">
        <input type="submit" value="Update Task">
    </form>
    
</div>

{% endblock %}
